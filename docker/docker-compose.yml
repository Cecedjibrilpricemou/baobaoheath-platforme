version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: baobao_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: baobaoheath_db
      POSTGRES_USER: baobao_user
      POSTGRES_PASSWORD: baobao_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baobao_user -d baobaoheath_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: baobao_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data: