<!-- features/auth/login/login.component.html -->
<!-- Design : card split — formes décoratives gauche + formulaire droite -->

<div class="login-page">
  <div class="login-card">

    <!-- ── Panneau gauche décoratif ──────────────────────────────────── -->
    <div class="login-left">

      <!-- Formes décoratives -->
      <div class="deco deco--circle-lg"></div>
      <div class="deco deco--circle-md"></div>
      <div class="deco deco--circle-sm"></div>

      <!-- Contenu gauche -->
      <div class="login-left__content">
        <div class="login-left__logo">
          <span class="login-left__logo-icon">🌳</span>
          <span class="login-left__logo-name">BaoBaoHealth</span>
        </div>
        <h1 class="login-left__title">Bienvenue</h1>
        <p class="login-left__sub">
          La plateforme de santé numérique de la Guinée — patients, agents et médecins connectés.
        </p>
        <div class="login-left__stats">
          <div class="stat">
            <span class="stat__num">9</span>
            <span class="stat__lbl">Modules</span>
          </div>
          <div class="stat">
            <span class="stat__num">62</span>
            <span class="stat__lbl">Routes</span>
          </div>
          <div class="stat">
            <span class="stat__num">8</span>
            <span class="stat__lbl">Rôles</span>
          </div>
        </div>
      </div>

    </div>

    <!-- ── Panneau droit : formulaire ───────────────────────────────── -->
    <div class="login-right">

      <div class="login-form-wrap">
        <h2 class="login-form__title">Connexion</h2>
        <p class="login-form__sub">Accédez à votre espace personnel</p>

        <!-- Erreur -->
        @if (errorMessage()) {
          <div class="form-alert">
            <i class="pi pi-exclamation-circle"></i>
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

          <!-- Téléphone -->
          <div class="field-wrap">
            <div class="field-box" [class.field-box--error]="errorMessage()">
              <div class="field-icon">
                <i class="pi pi-phone"></i>
              </div>
              <input
                type="tel"
                class="field-input"
                placeholder="Numéro de téléphone"
                [(ngModel)]="formData.telephone"
                name="telephone"
                required
                autocomplete="tel"
              />
            </div>
          </div>

          <!-- Mot de passe -->
          <div class="field-wrap">
            <div class="field-box" [class.field-box--error]="errorMessage()">
              <div class="field-icon">
                <i class="pi pi-lock"></i>
              </div>
              <input
                [type]="showPassword() ? 'text' : 'password'"
                class="field-input field-input--padded"
                placeholder="Mot de passe"
                [(ngModel)]="formData.motDePasse"
                name="motDePasse"
                required
                autocomplete="current-password"
              />
              <button
                type="button"
                class="field-toggle"
                (click)="togglePassword()"
                aria-label="Afficher ou masquer le mot de passe"
              >
                <span class="toggle-label">
                  {{ showPassword() ? 'CACHER' : 'VOIR' }}
                </span>
                <span class="sr-only">Afficher ou masquer le mot de passe</span>
              </button>
            </div>
          </div>

          <!-- Bouton -->
          <button type="submit" class="btn-submit" [disabled]="isLoading()">
            @if (isLoading()) {
              <i class="pi pi-spin pi-spinner"></i>
              <span>Connexion...</span>
            } @else {
              <span>Se connecter</span>
            }
          </button>

          <!-- Séparateur -->
          <div class="separator">
            <span class="separator__line"></span>
            <span class="separator__text">ou</span>
            <span class="separator__line"></span>
          </div>

          <!-- Bouton register -->
          <a routerLink="/auth/register" class="btn-outline">
            Créer un compte
          </a>

        </form>

        <p class="login-form__footer">
          Plateforme sécurisée — Guinée 🇬🇳
        </p>

      </div>
    </div>

  </div>
</div>
