<!-- features/auth/register/register.component.html -->
<!-- Page d'inscription BaoBaoHealth -->
<!-- Design : formulaire centré avec sélection de rôle par cards -->

<div class="register-wrapper">

    <!-- ── En-tête : logo + titre ──────────────────────────────────────── -->
    <div class="register-header">
        <div class="register-header__logo">
            <span class="register-header__logo-icon">🌳</span>
            <span class="register-header__logo-text">BaoBaoHealth</span>
        </div>
        <h2 class="register-header__title">Créer un compte</h2>
        <p class="register-header__desc">
            Rejoignez la plateforme de santé numérique de la Guinée
        </p>
    </div>

    <!-- ── Formulaire principal ────────────────────────────────────────── -->
    <div class="register-card">

        <!-- Message d'erreur -->
        @if (errorMessage()) {
        <div class="form-alert form-alert--error">
            <i class="pi pi-exclamation-circle"></i>
            <span>{{ errorMessage() }}</span>
        </div>
        }

        <!-- Message de succès -->
        @if (successMessage()) {
        <div class="form-alert form-alert--success">
            <i class="pi pi-check-circle"></i>
            <span>{{ successMessage() }}</span>
        </div>
        }

        <form (ngSubmit)="onSubmit()" #registerForm="ngForm">

            <!-- ── Sélection du rôle ── -->
            <div class="form-section">
                <label class="form-section__label">
                    <i class="pi pi-id-card"></i>
                    Je suis un(e)...
                </label>
                <div class="role-grid">
                    @for (role of rolesDisponibles; track role.value) {
                    <div class="role-card" [class.role-card--active]="formData.role === role.value"
                        (click)="selectRole(role.value)">
                        <i [class]="'pi ' + role.icon + ' role-card__icon'"></i>
                        <span class="role-card__label">{{ role.label }}</span>
                    </div>
                    }
                </div>
            </div>

            <!-- ── Nom + Prénom ── -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="nom">
                        <i class="pi pi-user"></i> Nom
                    </label>
                    <input id="nom" type="text" class="form-input" placeholder="Ex: Diallo" [(ngModel)]="formData.nom"
                        name="nom" required autocomplete="family-name" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="prenom">
                        <i class="pi pi-user"></i> Prénom
                    </label>
                    <input id="prenom" type="text" class="form-input" placeholder="Ex: Mamadou"
                        [(ngModel)]="formData.prenom" name="prenom" required autocomplete="given-name" />
                </div>
            </div>

            <!-- ── Téléphone ── -->
            <div class="form-group">
                <label class="form-label" for="telephone">
                    <i class="pi pi-phone"></i> Numéro de téléphone
                </label>
                <input id="telephone" type="tel" class="form-input" placeholder="Ex: 620 00 00 00"
                    [(ngModel)]="formData.telephone" name="telephone" required autocomplete="tel" />
            </div>

            <!-- ── Mot de passe ── -->
            <div class="form-group">
                <label class="form-label" for="motDePasse">
                    <i class="pi pi-lock"></i> Mot de passe
                </label>
                <div class="form-input-wrapper">
                    <input id="motDePasse" [type]="showPassword() ? 'text' : 'password'"
                        class="form-input form-input--with-icon" placeholder="Minimum 6 caractères"
                        [(ngModel)]="formData.motDePasse" name="motDePasse" required autocomplete="new-password" />
                    <!-- Toggle mot de passe — aria-label + sr-only pour accessibilité -->
                    <button type="button" class="form-input-toggle" (click)="togglePassword()"
                        aria-label="Afficher ou masquer le mot de passe">
                        <i [class]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
                        <span class="sr-only">Afficher ou masquer le mot de passe</span>
                    </button>
                </div>
            </div>

            <!-- ── Confirmation mot de passe ── -->
            <div class="form-group">
                <label class="form-label" for="confirmMotDePasse">
                    <i class="pi pi-lock"></i> Confirmer le mot de passe
                </label>
                <div class="form-input-wrapper">
                    <input id="confirmMotDePasse" [type]="showConfirmPassword() ? 'text' : 'password'"
                        class="form-input form-input--with-icon" placeholder="Répétez votre mot de passe"
                        [(ngModel)]="confirmMotDePasse" name="confirmMotDePasse" required autocomplete="new-password" />
                    <!-- Toggle confirmation — aria-label + sr-only pour accessibilité -->
                    <button type="button" class="form-input-toggle" (click)="toggleConfirmPassword()"
                        aria-label="Afficher ou masquer la confirmation du mot de passe">
                        <i [class]="showConfirmPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
                        <span class="sr-only">Afficher ou masquer la confirmation du mot de passe</span>
                    </button>
                </div>
            </div>

            <!-- ── Bouton soumettre ── -->
            <button type="submit" class="btn-primary" [disabled]="isLoading()">
                @if (isLoading()) {
                <i class="pi pi-spin pi-spinner"></i>
                <span>Création en cours...</span>
                } @else {
                <i class="pi pi-user-plus"></i>
                <span>Créer mon compte</span>
                }
            </button>

        </form>

        <!-- Lien vers login -->
        <div class="register-footer">
            <span>Déjà un compte ?</span>
            <a routerLink="/auth/login" class="register-footer__link">
                Se connecter
            </a>
        </div>

    </div>
</div>
