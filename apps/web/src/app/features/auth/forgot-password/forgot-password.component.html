<!-- features/auth/forgot-password/forgot-password.component.html -->
<app-auth-shell titleKey="AUTH.VISUAL.TITLE" textKey="AUTH.VISUAL.TEXT">

  @if (!submitted()) {

    <h1 class="bb-auth__title">{{ 'AUTH.FORGOT.TITLE' | translate }}</h1>
    <p class="bb-auth__sub">{{ 'AUTH.FORGOT.SUBTITLE' | translate }}</p>

    <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" novalidate>

      <div class="form-field-wrap">
        <label class="form-label" for="email">{{ 'AUTH.FORGOT.EMAIL' | translate }}</label>
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="bb-field-full">
          <i matPrefix class="pi pi-envelope"></i>
          <input
            matInput
            id="email"
            type="email"
            [placeholder]="'AUTH.FORGOT.EMAIL_PLACEHOLDER' | translate"
            [(ngModel)]="email"
            name="email"
            required
            autocomplete="email"
          />
        </mat-form-field>
      </div>

      <button
        matButton="filled"
        type="submit"
        class="bb-auth__submit"
        [disabled]="isLoading()"
      >
        <i [class]="isLoading() ? 'pi pi-spinner pi-spin' : 'pi pi-send'" aria-hidden="true"></i>
        {{ isLoading() ? ('AUTH.FORGOT.LOADING' | translate) : ('AUTH.FORGOT.SUBMIT' | translate) }}
      </button>

    </form>

  } @else {

    <!-- ── État succès ──────────────────────────────────────── -->
    <div class="auth-state" role="status" aria-live="polite">
      <div class="auth-state__icon auth-state__icon--success">
        <i class="pi pi-envelope" aria-hidden="true"></i>
      </div>
      <h1 class="bb-auth__title">{{ 'AUTH.FORGOT.SUCCESS_TITLE' | translate }}</h1>
      <p class="bb-auth__sub">{{ 'AUTH.FORGOT.SUCCESS_MSG' | translate }}</p>
    </div>

  }

  <div class="bb-auth__back">
    <a routerLink="/auth/login" class="bb-auth__link">
      <i class="pi pi-arrow-left"></i>
      {{ 'AUTH.FORGOT.BACK_LOGIN' | translate }}
    </a>
  </div>

  <p class="bb-auth__footer">
    <i class="pi pi-shield"></i>
    {{ 'AUTH.FORGOT.FOOTER' | translate }}
  </p>

</app-auth-shell>
