<!-- features/auth/forgot-password/forgot-password.component.html -->
<div class="auth-page">
  <div class="auth-card">

    <!-- ── Controls ──────────────────────────────────────────── -->
    <div class="auth-card__controls">
      <button type="button" class="ctrl-btn" (click)="toggleTheme()" [attr.aria-label]="(themeService.isDark() ? 'COMMON.ENABLE_LIGHT_MODE' : 'COMMON.ENABLE_DARK_MODE') | translate">
        <i [class]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'" aria-hidden="true"></i>
      </button>
      <button type="button" class="ctrl-btn" (click)="toggleLang()">
        <i class="pi pi-globe" aria-hidden="true"></i>
        <span>{{ 'COMMON.LANG_TOGGLE' | translate }}</span>
      </button>
    </div>

    @if (!submitted()) {

      <!-- ── Formulaire ─────────────────────────────────────── -->
      <div class="auth-card__header">
        <div class="auth-card__icon">
          <i class="pi pi-key"></i>
        </div>
        <h2 class="auth-card__title">{{ 'AUTH.FORGOT.TITLE' | translate }}</h2>
        <p class="auth-card__subtitle">{{ 'AUTH.FORGOT.SUBTITLE' | translate }}</p>
      </div>

      <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" novalidate>

        <div class="form-field-wrap">
          <label class="form-label" for="email">{{ 'AUTH.FORGOT.EMAIL' | translate }}</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="bb-field-full">
            <i matPrefix class="pi pi-envelope"></i>
            <input
              matInput
              id="email"
              type="email"
              [placeholder]="'AUTH.FORGOT.EMAIL_PLACEHOLDER' | translate"
              [(ngModel)]="email"
              name="email"
              required
              autocomplete="email"
            />
          </mat-form-field>
        </div>

        <button
          matButton="filled"
          type="submit"
          class="bb-field-full auth-submit-btn"
          [disabled]="isLoading()"
        >
          <i [class]="isLoading() ? 'pi pi-spinner pi-spin' : 'pi pi-send'" aria-hidden="true"></i>
          {{ isLoading() ? ('AUTH.FORGOT.LOADING' | translate) : ('AUTH.FORGOT.SUBMIT' | translate) }}
        </button>

      </form>

    } @else {

      <!-- ── État succès ────────────────────────────────────── -->
      <div class="auth-success" role="status" aria-live="polite">
        <div class="auth-success__icon">
          <i class="pi pi-envelope" aria-hidden="true"></i>
        </div>
        <h2 class="auth-card__title">{{ 'AUTH.FORGOT.SUCCESS_TITLE' | translate }}</h2>
        <p class="auth-card__subtitle">{{ 'AUTH.FORGOT.SUCCESS_MSG' | translate }}</p>
      </div>

    }

    <!-- ── Retour connexion ───────────────────────────────────── -->
    <div class="auth-card__back">
      <a routerLink="/auth/login" class="back-link">
        <i class="pi pi-arrow-left"></i>
        {{ 'AUTH.FORGOT.BACK_LOGIN' | translate }}
      </a>
    </div>

    <p class="auth-card__footer">
      <i class="pi pi-shield"></i>
      {{ 'AUTH.FORGOT.FOOTER' | translate }}
    </p>

  </div>
</div>
